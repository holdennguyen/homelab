apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-external
  namespace: argocd
spec:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: argocd
        app.kubernetes.io/instance: argocd
        component: server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8083
