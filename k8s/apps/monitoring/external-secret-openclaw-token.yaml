apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-openclaw-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: alertmanager-openclaw-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: OPENCLAW_HOOKS_TOKEN
