apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-external
  namespace: monitoring
spec:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: monitoring
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP\n      port: 3000\n
