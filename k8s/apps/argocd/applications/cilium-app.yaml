apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  labels:
    app.kubernetes.io/name: cilium
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: networking
    app.kubernetes.io/managed-by: argocd
spec:
  project: apps
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.17.0
    helm:
      valuesObject:
        # Enable agent (boolean per chart schema)
        agent: true
        # Agent configuration (top-level keys, not under agent)
        hostNetwork: true
        hostPID: true
        securityContext:
          privileged: true
        ebpf:
          enabled: true
        kubeProxyReplacement: false
        identityAllocationMode: crd
        ipam:
          mode: kubernetes
        cluster:
          name: homelab
          id: 1
        ipPools:
          - cidr: "10.42.0.0/16"
            enabled: true
        # Operator
        operator:
          enabled: true
          hostNetwork: false
        # Hubble
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
            service:
              type: NodePort
              nodePort: 30912
          listenAddress: :4244
          metrics:
            enabled:
              - "dns:1;delay=5s"
              - "drop:1;delay=5s"
              - "tcp:1;delay=5s"
              - "flow:1;delay=5s"
              - "port-distribution:1;delay=5s"
        # Disable unused features
        envoy:
          enabled: false
        bgp:
          enabled: false
        tls:
          enabled: false
        # Monitoring
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: false
        dns:
          maxDelay: 5s
        nodePort:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cilium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
