apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  labels:
    app.kubernetes.io/name: cilium
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: networking
    app.kubernetes.io/managed-by: argocd
spec:
  project: apps
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.17.0
    helm:
      valuesObject:
        # Agent is enabled by default; set security context for privileged mode
        securityContext:
          privileged: true
        # Host network and PID for Cilium agent
        hostNetwork: true
        hostPID: true
        # eBPF dataplane
        ebpf:
          enabled: true
        # Keep kube-proxy initially; can switch to strict later
        kubeProxyReplacement: disabled
        # Identity allocation
        identityAllocationMode: crd
        # IPAM
        ipam:
          mode: kubernetes
        # Cluster metadata
        cluster:
          name: homelab
          id: 1
        # Tunnel mode
        tunnel: vxlan
        # IP pool
        ipPools:
          - cidr: "10.42.0.0/16"
            enabled: true
            ipRotation: false
            tunnel: vxlan
        # Disable Envoy
        envoy:
          enabled: false
        # Operator
        operator:
          enabled: true
        # Hubble
        hubble:
          enabled: true
          listenAddress: :4244
          ui:
            enabled: true
            service:
              type: NodePort
              nodePort: 30912
          metrics:
            enabled:
              - "dns:1;delay=5s"
              - "drop:1;delay=5s"
              - "tcp:1;delay=5s"
              - "flow:1;delay=5s"
              - "port-distribution:1;delay=5s"
        # Prometheus metrics
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: false
        # DNS
        dns:
          maxDelay: 5s
        # NodePort
        nodePort:
          enabled: true
        # Containerd integration
        containerRuntime:
          integration:
            containerd:
              enabled: true
        # K8s API server
        k8sServiceHost: kubernetes.default.svc
        k8sServicePort: 6443
  destination:
    server: https://kubernetes.default.svc
    namespace: cilium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
